name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.6"
  PIP_VERSION: "26.2"
  NODE_VERSION: "26.7.0"
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/ryleastark/lnswitchboard
  DOCKERHUB_IMAGE: ryleastark/lnswitchboard
  CACHE_SCOPE: lnswitchboard

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint backend
        run: ruff check backend/

      - name: Test backend
        run: pytest backend/tests

      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container:
    name: Container build
    if: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push') }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver-opts: image=moby/buildkit:v0.32.1@sha256:c2ffdf4f39cb9d0fd0f63413d9354721cb83868a3f2f29583c3504a0c43a254b

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          pull: true
          push: false
          platforms: linux/amd64
          tags: lnswitchboard:test
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          provenance: false
          sbom: false

      - name: Smoke test image health
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm \
            --publish 127.0.0.1:22121:22121 \
            --publish 127.0.0.1:21212:21212 \
            --env LND_HOST=127.0.0.1 \
            --env TRUSTED_PROXY_CIDRS=172.16.0.0/12 \
            --env TRUSTED_HOSTS='127.0.0.1,localhost,pay.example' \
            --env DATA_STORE_PATH=/tmp/lnswitchboard.db \
            --env MACAROON_STORE_PATH=/tmp/macaroon.hex \
            --env NOSTR_ZAP_SECRET_PATH=/tmp/nostr-zap-signer.hex \
            lnswitchboard:test)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for _attempt in {1..30}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$health" == "healthy" ]]; then
              curl --fail --silent --show-error --header 'X-Forwarded-For: 192.168.50.10' http://127.0.0.1:22121/api/health
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'X-Forwarded-For: 198.51.100.10' http://127.0.0.1:22121/api/health)" = "403"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'X-Forwarded-For: 192.168.50.10' http://127.0.0.1:22121/.well-known/nostr.json)" = "404"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:21212/api/health)" = "404"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:21212/.well-known/nostr.json)" = "404"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --header 'X-Forwarded-For: 192.168.50.10' \
                --header 'Content-Type: application/json' \
                --data '{"local_part":"alice","domain":"pay.example"}' \
                http://127.0.0.1:22121/api/lnaddresses)" = "201"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --header 'Host: pay.example' \
                http://127.0.0.1:21212/.well-known/lnurlp/alice)" = "200"
              exit 0
            fi
            if [[ "$health" == "unhealthy" ]]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          docker logs "$container_id"
          echo "::error::Container did not become healthy within 30 seconds" >&2
          exit 1

  version:
    name: Version bump check
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check VERSION bump
        id: bump
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          current="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.rc[0-9]+)?$ ]]; then
            echo "::error::VERSION must contain a stable version (0.2.2) or RC version (0.2.2.rc1)" >&2
            exit 1
          fi

          if [[ "$current" =~ \.rc[0-9]+$ ]]; then
            echo "version=$current" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "RC VERSION detected; stable publication is intentionally skipped."
            exit 0
          fi

          before="$BEFORE_SHA"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [[ -z "$before" ]] || ! git cat-file -e "$before:VERSION" 2>/dev/null; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No previous VERSION file was available; skipping publish."
            exit 0
          fi

          previous="$(git show "$before:VERSION" | tr -d '[:space:]')"
          if [[ ! "$previous" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Previous VERSION value '$previous' is not a stable semantic version." >&2
            exit 1
          fi

          if [[ "$previous" == "$current" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "VERSION did not change; skipping publish."
            exit 0
          fi

          IFS=. read -r previous_major previous_minor previous_patch <<< "$previous"
          IFS=. read -r current_major current_minor current_patch <<< "$current"

          if (( current_major > previous_major ||
                (current_major == previous_major && current_minor > previous_minor) ||
                (current_major == previous_major && current_minor == previous_minor && current_patch > previous_patch) )); then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "VERSION bumped from $previous to $current; publish is enabled."
          else
            echo "::error::VERSION changed from $previous to $current, but it was not bumped." >&2
            exit 1
          fi

  publish:
    name: Publish container
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.version.outputs.bumped == 'true' }}
    needs: [backend, frontend, container, version]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver-opts: image=moby/buildkit:v0.32.1@sha256:c2ffdf4f39cb9d0fd0f63413d9354721cb83868a3f2f29583c3504a0c43a254b

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Inspect existing version tags
        id: existing
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          any=false
          for entry in "ghcr=$GHCR_IMAGE" "dockerhub=$DOCKERHUB_IMAGE"; do
            key="${entry%%=*}"
            image="${entry#*=}"
            exists=false
            if inspection="$(docker buildx imagetools inspect "$image:$VERSION" 2>&1)"; then
              exists=true
              any=true
            elif ! grep --extended-regexp --quiet '^ERROR: .+: not found$' <<< "$inspection"; then
              echo "::error::Unable to inspect $image:$VERSION: $inspection" >&2
              exit 1
            fi
            echo "${key}_exists=$exists" >> "$GITHUB_OUTPUT"
          done
          echo "any_exists=$any" >> "$GITHUB_OUTPUT"

      - name: Validate resumable version tags
        if: ${{ steps.existing.outputs.any_exists == 'true' }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GHCR_EXISTS: ${{ steps.existing.outputs.ghcr_exists }}
          DOCKERHUB_EXISTS: ${{ steps.existing.outputs.dockerhub_exists }}
        shell: bash
        run: |
          set -euo pipefail
          images=()
          [[ "$GHCR_EXISTS" == "true" ]] && images+=("$GHCR_IMAGE")
          [[ "$DOCKERHUB_EXISTS" == "true" ]] && images+=("$DOCKERHUB_IMAGE")
          python3 scripts/verify_image_manifests.py "$VERSION" "${images[@]}" --revision "$GITHUB_SHA" --version-only

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=lnSwitchboard
            org.opencontainers.image.description=Lightning Network switchboard service
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish source image
        if: ${{ steps.existing.outputs.any_exists != 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          provenance: mode=max
          sbom: true

      - name: Replicate missing version tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GHCR_EXISTS: ${{ steps.existing.outputs.ghcr_exists }}
          DOCKERHUB_EXISTS: ${{ steps.existing.outputs.dockerhub_exists }}
        shell: bash
        run: |
          set -euo pipefail
          source="$GHCR_IMAGE:$VERSION"
          if [[ "$GHCR_EXISTS" != "true" && "$DOCKERHUB_EXISTS" == "true" ]]; then
            source="$DOCKERHUB_IMAGE:$VERSION"
            docker buildx imagetools create --tag "$GHCR_IMAGE:$VERSION" "$source"
          fi
          if [[ "$DOCKERHUB_EXISTS" != "true" ]]; then
            docker buildx imagetools create --tag "$DOCKERHUB_IMAGE:$VERSION" "$source"
          fi

      - name: Verify versioned image manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/verify_image_manifests.py "$VERSION" "$GHCR_IMAGE" "$DOCKERHUB_IMAGE" --revision "$GITHUB_SHA" --version-only

      - name: Promote verified images to latest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done

      - name: Verify promoted image manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/verify_image_manifests.py "$VERSION" "$GHCR_IMAGE" "$DOCKERHUB_IMAGE" --revision "$GITHUB_SHA"
