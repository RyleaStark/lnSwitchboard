name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_version_check:
        description: Publish even when VERSION was not bumped
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11.15"
  NODE_VERSION: "22.23.1"
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/ryleastark/lnswitchboard
  DOCKERHUB_IMAGE: ryleastark/lnswitchboard
  CACHE_SCOPE: lnswitchboard

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint backend
        run: ruff check backend/

      - name: Test backend
        run: pytest backend/tests

      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container:
    name: Container build
    if: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          provenance: false
          sbom: false

  version:
    name: Version bump check
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check VERSION bump
        id: bump
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          SKIP_VERSION_CHECK: ${{ inputs.skip_version_check || false }}
        run: |
          set -euo pipefail

          current="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a Docker-compatible semantic version such as 0.2.2" >&2
            exit 1
          fi

          before="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SKIP_VERSION_CHECK" == "true" ]]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Manual version check override enabled; publish is enabled for VERSION $current."
            exit 0
          fi

          if [[ -z "$before" ]] || ! git cat-file -e "$before:VERSION" 2>/dev/null; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No previous VERSION file was available; skipping publish."
            exit 0
          fi

          previous="$(git show "$before:VERSION" | tr -d '[:space:]')"
          if [[ ! "$previous" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Previous VERSION value '$previous' is not semantic." >&2
            exit 1
          fi

          if [[ "$previous" == "$current" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "VERSION did not change; skipping publish."
            exit 0
          fi

          IFS=. read -r previous_major previous_minor previous_patch <<< "$previous"
          IFS=. read -r current_major current_minor current_patch <<< "$current"

          if (( current_major > previous_major ||
                (current_major == previous_major && current_minor > previous_minor) ||
                (current_major == previous_major && current_minor == previous_minor && current_patch > previous_patch) )); then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "VERSION bumped from $previous to $current; publish is enabled."
          else
            echo "::error::VERSION changed from $previous to $current, but it was not bumped." >&2
            exit 1
          fi

  publish:
    name: Publish container
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.version.outputs.bumped == 'true' }}
    needs: [backend, frontend, container, version]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=lnSwitchboard
            org.opencontainers.image.description=Lightning Network switchboard service

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          provenance: false
          sbom: false
