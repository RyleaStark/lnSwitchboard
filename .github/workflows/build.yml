name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/ryleastark/lnswitchboard
  DOCKERHUB_IMAGE: ryleastark/lnswitchboard
  CACHE_SCOPE: lnswitchboard

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest ruff

      - name: Lint backend
        run: ruff check backend/

      - name: Test backend
        run: pytest backend/tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container:
    name: Container build
    if: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          provenance: false
          sbom: false

  version:
    name: Version bump check
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check VERSION bump
        id: bump
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          current="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a Docker-compatible semantic version such as 0.2.2" >&2
            exit 1
          fi

          before="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [[ -z "$before" ]] || ! git cat-file -e "$before:VERSION" 2>/dev/null; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No previous VERSION file was available; skipping publish."
            exit 0
          fi

          previous="$(git show "$before:VERSION" | tr -d '[:space:]')"
          if [[ ! "$previous" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Previous VERSION value '$previous' is not semantic." >&2
            exit 1
          fi

          if [[ "$previous" == "$current" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "VERSION did not change; skipping publish."
            exit 0
          fi

          IFS=. read -r previous_major previous_minor previous_patch <<< "$previous"
          IFS=. read -r current_major current_minor current_patch <<< "$current"

          if (( current_major > previous_major ||
                (current_major == previous_major && current_minor > previous_minor) ||
                (current_major == previous_major && current_minor == previous_minor && current_patch > previous_patch) )); then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "VERSION bumped from $previous to $current; publish is enabled."
          else
            echo "::error::VERSION changed from $previous to $current, but it was not bumped." >&2
            exit 1
          fi

  publish:
    name: Publish container
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.version.outputs.bumped == 'true' }}
    needs: [backend, frontend, container, version]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=lnSwitchboard
            org.opencontainers.image.description=Lightning Network switchboard service

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          provenance: false
          sbom: false
