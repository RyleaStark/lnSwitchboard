name: Publish RC image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release-candidate version (for example 0.4.0.rc1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Publication is manual-only and every attempt for one immutable version
  # shares the same lock regardless of the selected ref or commit.
  group: publish-rc-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/ryleastark/lnswitchboard
  CACHE_SCOPE: lnswitchboard

jobs:
  verify-ci:
    name: Verify exact main SHA passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::release candidates may only be published from main" >&2
            exit 1
          }
          RUNS="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100")"
          jq -e --arg sha "$GITHUB_SHA" \
            '.workflow_runs | any(.head_sha == $sha and .conclusion == "success" and .event == "push")' \
            <<<"$RUNS" >/dev/null || {
              echo "::error::the exact main commit has not passed the CI workflow" >&2
              exit 1
            }

  publish:
    name: Publish GHCR release candidate
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate candidate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION:-$(tr -d '[:space:]' < VERSION)}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.rc[1-9][0-9]*$ ]] || {
            echo "::error::version must be an immutable release candidate such as 0.4.0.rc1" >&2
            exit 1
          }
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION" || {
            echo "::error::VERSION must exactly match the requested release candidate" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver-opts: image=moby/buildkit:v0.32.1@sha256:c2ffdf4f39cb9d0fd0f63413d9354721cb83868a3f2f29583c3504a0c43a254b

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace an existing candidate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail-closed: only a positively identified 404 means the tag is
          # vacant. Auth failures, timeouts, rate limits, or any other
          # registry error abort the run instead of risking an overwrite.
          REPO="${GHCR_IMAGE#ghcr.io/}"
          TOKEN="$(
            curl -fsSL \
              -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              "https://ghcr.io/token?scope=repository:${REPO}:pull" \
            | jq -r .token
          )"
          STATUS="$(
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${REPO}/manifests/${VERSION}"
          )"
          if [[ "$STATUS" == "200" ]]; then
            echo "::error::GHCR candidate tag already exists and is immutable: $GHCR_IMAGE:$VERSION" >&2
            exit 1
          fi
          if [[ "$STATUS" != "404" ]]; then
            echo "::error::unable to verify GHCR tag vacancy (HTTP $STATUS); refusing to publish" >&2
            exit 1
          fi

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=lnSwitchboard
            org.opencontainers.image.description=Lightning Network switchboard service release candidate
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish GHCR candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          provenance: mode=max
          sbom: true

      - name: Verify immutable GHCR candidate manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/verify_image_manifests.py "$VERSION" "$GHCR_IMAGE" --revision "$GITHUB_SHA" --version-only
