services:
  permissions-init:
    image: ghcr.io/ryleastark/lnswitchboard:${LNSWITCHBOARD_VERSION:-0.4.0.rc27}
    container_name: lnswitchboard-permissions-init
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/usr/local/bin/lnswitchboard-prepare-state"]
    volumes:
      - ./secrets:/app-secrets
      - tailscale-control:/tailscale-control
      - tailscale-state:/tailscale-state
      - zrok-control:/zrok-control
      - zrok-state:/zrok-state
      - public-backend:/public-socket
    restart: "no"

  lnswitchboard:
    image: ghcr.io/ryleastark/lnswitchboard:${LNSWITCHBOARD_VERSION:-0.4.0.rc27}
    container_name: lnswitchboard
    restart: unless-stopped
    depends_on:
      permissions-init:
        condition: service_completed_successfully
    user: "1000:1000"
    read_only: true
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LISTENER_MODE: admin
      DATA_STORE_PATH: /app/secrets/lnswitchboard.db
      PUBLIC_BACKEND_SOCKET_PATH: /run/lnswitchboard-public/public.sock
      SERVICE_PORT: 22121
      PUBLIC_SERVICE_PORT: 21212
      LND_HOST: LND_HOST_IP
      LND_GRPC_PORT: 10009
      LND_TLS_PATH: /lnd/tls.cert
      LND_MACAROON_PATH: /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK:-mainnet}/invoice.macaroon
      LND_READONLY_MACAROON_PATH: /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK:-mainnet}/readonly.macaroon
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-localhost,127.0.0.1,[::1]}"
      CLOUDFLARED_CONNECTOR_ENABLED: "true"
      CLOUDFLARED_TOKEN_PATH: /app/secrets/cloudflare-mesh/node.env
      CLOUDFLARED_ORIGIN_URL: http://lnswitchboard-public:21212
      CLOUDFLARED_TOKEN_GID: "${CLOUDFLARED_TOKEN_GID:-1000}"
      CLOUDFLARE_OAUTH_CLIENT_ID: "${CLOUDFLARE_OAUTH_CLIENT_ID:-placeholder-client-id}"
      CLOUDFLARE_OAUTH_SCOPE: "${CLOUDFLARE_OAUTH_SCOPE:-offline_access account-settings.read zone.read dns.read dns.write workers-scripts.read workers-scripts.write workers-scripts.bind connectivity-directory.bind workers-routes.read workers-routes.write teams-connector-warp.read teams-connector-warp.write teams.read teams.write access.read access.write}"
      CLOUDFLARE_OAUTH_REDIRECT_LOOPBACK: "${CLOUDFLARE_OAUTH_REDIRECT_LOOPBACK:-http://127.0.0.1:22121/api/cloudflare/oauth/callback}"
      CLOUDFLARE_OAUTH_REDIRECT_PAGE: "${CLOUDFLARE_OAUTH_REDIRECT_PAGE:-https://placeholder.invalid/oauth/callback}"
      TAILSCALE_CONNECTOR_ENABLED: "true"
      TAILSCALE_PUBLIC_ORIGIN: http://127.0.0.1:21212
      TAILSCALE_CONTROL_DIR: /app/secrets/tailscale/control
      TAILSCALE_STATUS_DIR: /app/secrets/tailscale/status
      ZROK_CONNECTOR_ENABLED: "true"
      ZROK_PUBLIC_ORIGIN: http://public:21212
      ZROK_CONTROL_DIR: /app/secrets/zrok/control
      ZROK_STATUS_DIR: /app/secrets/zrok/status
    volumes:
      - ./secrets:/app/secrets:rw
      - tailscale-control:/app/secrets/tailscale
      - zrok-control:/app/secrets/zrok
      - ${APP_LIGHTNING_NODE_DATA_DIR:-/app-data/lightning/data/lnd}:/lnd:ro
      - public-backend:/run/lnswitchboard-public:rw
    ports:
      - "${LNSWITCHBOARD_BIND_ADDRESS:-127.0.0.1}:22121:22121"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:22121/api/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default: {}

  lnswitchboard-public:
    image: ghcr.io/ryleastark/lnswitchboard:${LNSWITCHBOARD_VERSION:-0.4.0.rc27}
    container_name: lnswitchboard-public
    restart: unless-stopped
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      lnswitchboard:
        condition: service_healthy
    user: "1000:1000"
    read_only: true
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LISTENER_MODE: public
      PUBLIC_BACKEND_SOCKET_PATH: /run/lnswitchboard-public/public.sock
      PUBLIC_SERVICE_PORT: 21212
    volumes:
      - public-backend:/run/lnswitchboard-public:ro
    ports:
      - "${PUBLIC_SERVICE_PORT:-21212}:21212"
    networks:
      cloudflare-egress:
        aliases:
          - lnswitchboard-public
          - lns.internal
      zrok-public:
        aliases:
          - public
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.error, urllib.request;
          url='http://127.0.0.1:21212/api/health';
          code=None;
          exec("try:\n urllib.request.urlopen(url, timeout=2).read()\nexcept urllib.error.HTTPError as exc:\n code=exc.code");
          raise SystemExit(0 if code == 404 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflare-mesh:
    image: cloudflare/mesh:2026.7.0@sha256:18fad6d500e8ca48b7e4d5ae1905d65e8a50c1f5f5e21eba020d54d5cbf82571
    container_name: lnswitchboard-cloudflare-mesh
    entrypoint: ["sh", "/opt/lnswitchboard/mesh-entrypoint.sh"]
    restart: unless-stopped
    stop_grace_period: 30s
    group_add:
      - "1000"
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      lnswitchboard:
        condition: service_healthy
      lnswitchboard-public:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    environment:
      MESH_NODE_TOKEN_FILE: /run/lnswitchboard/node.env
    volumes:
      - ./scripts/mesh-entrypoint.sh:/opt/lnswitchboard/mesh-entrypoint.sh:ro
      - ./secrets/cloudflare-mesh:/run/lnswitchboard:ro
      - cloudflare-mesh-state:/var/lib/cloudflare-warp
    networks:
      - cloudflare-egress

  tailscale:
    image: tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    container_name: lnswitchboard-tailscale
    entrypoint: ["/usr/local/bin/lnswitchboard-tailscale-supervisor"]
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      lnswitchboard-public:
        condition: service_healthy
    network_mode: service:lnswitchboard-public
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "true"
      TS_CONTROL_DIR: /run/lnswitchboard/control
      TS_STATUS_DIR: /run/lnswitchboard/status
      TS_LOGIN_RETENTION_SECONDS: "300"
      TS_NO_LOGS_NO_SUPPORT: "true"
      TS_FUNNEL_TARGET: http://127.0.0.1:21212
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-control:/run/lnswitchboard
      - ./deploy/tailscale/supervisor.sh:/usr/local/bin/lnswitchboard-tailscale-supervisor:ro
    tmpfs:
      - /var/run/tailscale:size=16m,mode=0750,uid=1000,gid=1000
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/tailscale/tailscaled.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  zrok:
    image: openziti/zrok2:2.0.4@sha256:310ab634172ce03dd23ff1ee8515195e1a564197dbc4e6cdfd57dad2fb822400
    container_name: lnswitchboard-zrok
    entrypoint: ["/usr/local/bin/lnswitchboard-zrok-supervisor"]
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      lnswitchboard-public:
        condition: service_healthy
    read_only: true
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /var/lib/zrok
      ZROK_TARGET: http://public:21212
      ZROK_CONTROL_DIR: /run/lnswitchboard/control
      ZROK_STATUS_DIR: /run/lnswitchboard/status
    volumes:
      - zrok-state:/var/lib/zrok
      - zrok-control:/run/lnswitchboard
      - ./deploy/zrok/supervisor.sh:/usr/local/bin/lnswitchboard-zrok-supervisor:ro
    networks:
      - zrok-public
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  public-backend:
  tailscale-state:
  tailscale-control:
  zrok-state:
  zrok-control:
  cloudflare-mesh-state:

networks:
  cloudflare-egress:
    driver: bridge
  zrok-public:
    driver: bridge
