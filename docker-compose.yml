services:
  lnswitchboard:
    image: ghcr.io/ryleastark/lnswitchboard:0.3.2
    container_name: lnswitchboard
    restart: unless-stopped
    environment:
      SERVICE_PORT: 22121
      PUBLIC_SERVICE_PORT: 21212
      LND_HOST: LND_HOST_IP
      LND_GRPC_PORT: 10009
      LND_TLS_PATH: /lnd/tls.cert
      LND_MACAROON_PATH: /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK:-mainnet}/invoice.macaroon
      LND_READONLY_MACAROON_PATH: /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK:-mainnet}/readonly.macaroon
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-localhost,127.0.0.1,[::1]}"
      CLOUDFLARED_CONNECTOR_ENABLED: "true"
      CLOUDFLARED_TOKEN_PATH: /app/secrets/cloudflared/tunnel.token
      CLOUDFLARED_METRICS_URL: http://cloudflared:2000
      CLOUDFLARED_ORIGIN_URL: http://lnswitchboard:21212
      CLOUDFLARED_TOKEN_GID: "${CLOUDFLARED_TOKEN_GID:-0}"
    volumes:
      - ./secrets:/app/secrets:rw
      - ${APP_LIGHTNING_NODE_DATA_DIR:-/app-data/lightning/data/lnd}:/lnd:ro
    ports:
      - "${LNSWITCHBOARD_BIND_ADDRESS:-127.0.0.1}:22121:22121"
      - "${LNSWITCHBOARD_PUBLIC_BIND_ADDRESS:-127.0.0.1}:21212:21212"

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    container_name: lnswitchboard-cloudflared
    user: "65532:${CLOUDFLARED_TOKEN_GID:-0}"
    entrypoint: ["cloudflared"]
    command:
      - tunnel
      - --autoupdate-freq
      - 24h
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/lnswitchboard/tunnel.token
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      lnswitchboard:
        condition: service_healthy
    volumes:
      - ./secrets/cloudflared:/run/lnswitchboard:ro
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
