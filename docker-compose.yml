version: "3.9"

services:
  lnswitchboard:
    image: ghcr.io/ryleastark/lnswitchboard:0.1.1
    container_name: lnswitchboard
    restart: unless-stopped
    environment:
      SERVICE_PORT: 22121
      LND_HOST: LND_HOST_IP
      LND_GRPC_PORT: 10009
      LND_TLS_PATH: /lnd/tls.cert
    volumes:
      - ./secrets:/app/secrets:rw
      - /app-data/lightning/data/lnd:/lnd:ro
    ports:
      - "22121:22121"
