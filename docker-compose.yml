services:
  lnswitchboard:
    image: ghcr.io/ryleastark/lnswitchboard:0.3.1
    container_name: lnswitchboard
    restart: unless-stopped
    environment:
      SERVICE_PORT: 22121
      LND_HOST: LND_HOST_IP
      LND_GRPC_PORT: 10009
      LND_TLS_PATH: /lnd/tls.cert
      LND_MACAROON_PATH: /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK:-mainnet}/invoice.macaroon
      LND_READONLY_MACAROON_PATH: /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK:-mainnet}/readonly.macaroon
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-localhost,127.0.0.1,[::1]}"
    volumes:
      - ./secrets:/app/secrets:rw
      - ${APP_LIGHTNING_NODE_DATA_DIR:-/app-data/lightning/data/lnd}:/lnd:ro
    ports:
      - "${LNSWITCHBOARD_BIND_ADDRESS:-127.0.0.1}:22121:22121"
