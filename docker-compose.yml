services:
  lnswitchboard:
    image: ghcr.io/ryleastark/lnswitchboard:${LNSWITCHBOARD_VERSION:-0.4.0.rc16}
    container_name: lnswitchboard
    restart: unless-stopped
    environment:
      SERVICE_PORT: 22121
      PUBLIC_SERVICE_PORT: 21212
      LND_HOST: LND_HOST_IP
      LND_GRPC_PORT: 10009
      LND_TLS_PATH: /lnd/tls.cert
      LND_MACAROON_PATH: /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK:-mainnet}/invoice.macaroon
      LND_READONLY_MACAROON_PATH: /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK:-mainnet}/readonly.macaroon
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-localhost,127.0.0.1,[::1]}"
      CLOUDFLARED_CONNECTOR_ENABLED: "true"
      CLOUDFLARED_TOKEN_PATH: /app/secrets/cloudflare-mesh/node.env
      CLOUDFLARED_ORIGIN_URL: http://lnswitchboard:21212
      CLOUDFLARED_TOKEN_GID: "${CLOUDFLARED_TOKEN_GID:-0}"
      CLOUDFLARE_OAUTH_CLIENT_ID: "${CLOUDFLARE_OAUTH_CLIENT_ID:-placeholder-client-id}"
      CLOUDFLARE_OAUTH_SCOPE: "${CLOUDFLARE_OAUTH_SCOPE:-offline_access account-settings.read zone.read dns.read dns.write workers-scripts.read workers-scripts.write workers-scripts.bind connectivity-directory.bind workers-routes.read workers-routes.write teams-connector-warp.read teams-connector-warp.write teams.read teams.write access.read access.write}"
      CLOUDFLARE_OAUTH_REDIRECT_LOOPBACK: "${CLOUDFLARE_OAUTH_REDIRECT_LOOPBACK:-http://127.0.0.1:22121/api/cloudflare/oauth/callback}"
      CLOUDFLARE_OAUTH_REDIRECT_PAGE: "${CLOUDFLARE_OAUTH_REDIRECT_PAGE:-https://placeholder.invalid/oauth/callback}"
      TAILSCALE_CONNECTOR_ENABLED: "true"
      TAILSCALE_CONTROL_DIR: /app/secrets/tailscale/control
      TAILSCALE_STATUS_DIR: /app/secrets/tailscale/status
    volumes:
      - ./secrets:/app/secrets:rw
      - tailscale-control:/app/secrets/tailscale
      - ${APP_LIGHTNING_NODE_DATA_DIR:-/app-data/lightning/data/lnd}:/lnd:ro
    ports:
      - "${LNSWITCHBOARD_BIND_ADDRESS:-127.0.0.1}:22121:22121"
      - "${PUBLIC_SERVICE_PORT:-21212}:21212"
    networks:
      default:
        aliases:
          - lns.internal

  cloudflare-mesh:
    image: cloudflare/mesh:2026.7.0@sha256:18fad6d500e8ca48b7e4d5ae1905d65e8a50c1f5f5e21eba020d54d5cbf82571
    container_name: lnswitchboard-cloudflare-mesh
    entrypoint: ["sh", "/opt/lnswitchboard/mesh-entrypoint.sh"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      lnswitchboard:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    environment:
      MESH_NODE_TOKEN_FILE: /run/lnswitchboard/node.env
    volumes:
      - ./scripts/mesh-entrypoint.sh:/opt/lnswitchboard/mesh-entrypoint.sh:ro
      - ./secrets/cloudflare-mesh:/run/lnswitchboard:ro
      - cloudflare-mesh-state:/var/lib/cloudflare-warp

  tailscale:
    image: tailscale/tailscale:v1.98.10@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0
    container_name: lnswitchboard-tailscale
    entrypoint: ["/usr/local/bin/lnswitchboard-tailscale-supervisor"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      lnswitchboard:
        condition: service_healthy
    network_mode: service:lnswitchboard
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "true"
      TS_CONTROL_DIR: /run/lnswitchboard/control
      TS_STATUS_DIR: /run/lnswitchboard/status
      TS_LOGIN_RETENTION_SECONDS: "300"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-control:/run/lnswitchboard
      - ./deploy/tailscale/supervisor.sh:/usr/local/bin/lnswitchboard-tailscale-supervisor:ro
    tmpfs:
      - /var/run/tailscale:mode=0750
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/tailscale/tailscaled.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tailscale-state:
  tailscale-control:
  cloudflare-mesh-state:
